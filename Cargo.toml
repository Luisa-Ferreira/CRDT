[package]
name = "crdt-sss-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"]}
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
time = "0.3"

[lib]
name = "crdt_sss_rs"
path = "src/lib.rs"

[[bin]]
name = "crdt-sss-rs"
path = "src/main.rs"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 0
debug = true